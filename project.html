<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przepisy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Strona Główna</h1>

    <div class="panel">

        <input type="text" id="wyszukiwarka" placeholder="Wyszukaj przepis...">

        <select id="kategoria">

            <option value="all">
                Wszystkie kategorie
            </option>

        </select>

        <select id="sortowanie">

            <option value="default">
                Sortowanie
            </option>

            <option value="az">
                A-Z
            </option>

            <option value="za">
                Z-A
            </option>

        </select>

        <button id="pokazUlubione">
        Ulubione
        </button>

        <button id="wszystkiePrzepisy">
        Wszystkie przepisy
        </button>
    </div>
    
</header>

<main id="container">
</main>

<footer>
    <p><strong>&copy 2026 Mateusz German    Maciej Adamczuk</strong></p>
</footer>

<div id="modal" class="modal">

    <div class="modal-content">

        <span id="zamknij">&times;</span>

        <h2 id="modalTytul"></h2>

        <p id="modalOpis"></p>

    </div>

</div>
<script src="script.js"></script>
</body>
</html>
